server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: forum-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/forum_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:forum_app}
    password: ${DB_PASSWORD:forum_password}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    internal-token: ${INTERNAL_SERVICE_TOKEN:change-this-internal-service-token}
  services:
    identity-url: ${IDENTITY_SERVICE_URL:http://identity-service}
  cache:
    user-summary-ttl: ${USER_SUMMARY_CACHE_TTL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
